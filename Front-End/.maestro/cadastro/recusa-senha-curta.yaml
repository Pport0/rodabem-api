# RNE-01: "Senha deve possuir no minimo 6 caracteres".
appId: com.anonymous.rodabem
name: cadastro - recusa senha com menos de seis caracteres
---
- runScript: ../_comum/identidade.js
- runFlow: ../_comum/abrir.yaml
- tapOn: "CRIAR CONTA"
- runFlow:
    file: ../_comum/preencher-cadastro.yaml
    env:
      NOME: ${output.nome}
      CPF: ${output.cpf}
      TELEFONE: ${output.telefone}
      EMAIL: ${output.email}
      SENHA: "12345"
- scrollUntilVisible:
    element: "CONTINUAR"
    direction: DOWN
- tapOn: "CONTINUAR"
- assertVisible: "A senha deve ter no mínimo 6 caracteres"
