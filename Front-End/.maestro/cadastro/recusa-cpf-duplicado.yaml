# RNE-01: o CPF precisa ser unico. Cadastra uma vez e tenta de novo com o mesmo CPF — o fluxo e autossuficiente, nao depende de dado semeado antes.
appId: com.anonymous.rodabem
name: cadastro - recusa cpf ja cadastrado
---
- runScript: ../_comum/identidade.js
- runFlow: ../_comum/abrir.yaml
- tapOn: "CRIAR CONTA"
- runFlow:
    file: ../_comum/preencher-cadastro.yaml
    env:
      NOME: ${output.nome}
      CPF: ${output.cpf}
      TELEFONE: ${output.telefone}
      EMAIL: ${output.email}
      SENHA: ${output.senha}
- scrollUntilVisible:
    element: "CONTINUAR"
    direction: DOWN
- tapOn: "CONTINUAR"
- extendedWaitUntil:
    visible: "Insira suas credenciais para acessar"
    timeout: 30000

# Segunda tentativa: mesmo CPF, e-mail e telefone diferentes.
- runFlow: ../_comum/abrir.yaml
- tapOn: "CRIAR CONTA"
- runFlow:
    file: ../_comum/preencher-cadastro.yaml
    env:
      NOME: ${output.nome}
      CPF: ${output.cpf}
      TELEFONE: "62910000001"
      EMAIL: "outro${output.email}"
      SENHA: ${output.senha}
- scrollUntilVisible:
    element: "CONTINUAR"
    direction: DOWN
- tapOn: "CONTINUAR"
- extendedWaitUntil:
    visible: "Falha ao criar usuário"
    timeout: 70000
