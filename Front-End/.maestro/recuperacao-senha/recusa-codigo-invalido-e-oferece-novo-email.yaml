appId: com.anonymous.rodabem
name: recuperacao de senha - recusa codigo invalido e oferece pedir novo e-mail
---
- runScript: ../_comum/identidade.js
- runFlow: ../_comum/abrir.yaml
- tapOn: "ENTRAR"
- extendedWaitUntil:
    visible: "Esqueci minha senha"
    timeout: 30000
- tapOn: "Esqueci minha senha"
- extendedWaitUntil:
    visible: "Digite o e-mail cadastrado"
    timeout: 20000
- tapOn: "Digite o e-mail cadastrado"
- inputText: ${output.email}
- runFlow: ../_comum/fechar-teclado.yaml
- tapOn: "ENVIAR"
- extendedWaitUntil:
    visible: "JÁ TENHO O CÓDIGO"
    timeout: 30000
- tapOn: "JÁ TENHO O CÓDIGO"
- extendedWaitUntil:
    visible: "Cole aqui o código do e-mail"
    timeout: 20000
- tapOn: "Cole aqui o código do e-mail"
- inputText: "00000000-0000-0000-0000-000000000000"
- runFlow: ../_comum/fechar-teclado.yaml
- tapOn: "Digite a nova senha"
- inputText: "senhanova123"
- runFlow: ../_comum/fechar-teclado.yaml
- tapOn: "Confirme a nova senha"
- inputText: "senhanova123"
- runFlow: ../_comum/fechar-teclado.yaml
- tapOn:
    text: "REDEFINIR SENHA"
    below:
      text: "CONFIRME A NOVA SENHA"
- extendedWaitUntil:
    visible: "Este código é inválido ou já expirou. Cada código vale por 30 minutos e só pode ser usado uma vez."
    timeout: 30000
- tapOn: "PEDIR NOVO E-MAIL"
- extendedWaitUntil:
    visible: "Digite o e-mail cadastrado"
    timeout: 20000
