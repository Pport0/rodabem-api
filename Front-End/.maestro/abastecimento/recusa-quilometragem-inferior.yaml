# RNE-17: "Nao sera permitido registrar quilometragem inferior a ultima quilometragem registrada para o mesmo caminhao".
appId: com.anonymous.rodabem
name: abastecimento - recusa quilometragem inferior a ultima
---
- runScript: ../_comum/identidade.js
- runFlow: ../_comum/abrir.yaml
- tapOn: "CRIAR CONTA"
- runFlow:
    file: ../_comum/preencher-cadastro.yaml
    env:
      NOME: ${output.nome}
      CPF: ${output.cpf}
      TELEFONE: ${output.telefone}
      EMAIL: ${output.email}
      SENHA: ${output.senha}
- scrollUntilVisible:
    element: "CONTINUAR"
    direction: DOWN
- tapOn: "CONTINUAR"
- extendedWaitUntil:
    visible: "Insira suas credenciais para acessar"
    timeout: 30000
- runFlow:
    file: ../_comum/entrar.yaml
    env:
      CREDENCIAL: ${output.telefone}
      SENHA: ${output.senha}
- extendedWaitUntil:
    visible: "O que você precisa hoje?"
    timeout: 30000
# O cartao MEU CAMINHAO da home leva ao PERFIL: o caminhao e uma secao dele, e o formulario abre pelo botao "Cadastrar Caminhao".
- tapOn: "MEU CAMINHÃO"
- extendedWaitUntil:
    visible: "Cadastrar Caminhão"
    timeout: 30000
- tapOn: "Cadastrar Caminhão"
- extendedWaitUntil:
    visible: "ABC1234 ou ABC1D23"
    timeout: 30000
- tapOn: "ABC1234 ou ABC1D23"
- inputText: "RDB1A23"
- hideKeyboard
- tapOn: "Ex: Scania R450"
- inputText: "Scania R450"
- hideKeyboard
- tapOn: "00000000000"
- inputText: "12345678901"
- hideKeyboard
- tapOn: "Ex: 6"
- inputText: "6"
- hideKeyboard
- scrollUntilVisible:
    element: "CADASTRAR CAMINHAO"
    direction: DOWN
    visibilityPercentage: 30
- tapOn: "CADASTRAR CAMINHAO"
- extendedWaitUntil:
    visible: "RDB1A23"
    timeout: 30000
# O cadastro do caminhao termina no PERFIL. O cartao ABASTECIMENTOS so existe na tela inicial.
- back
- extendedWaitUntil:
    visible: "O que você precisa hoje?"
    timeout: 30000
- tapOn: "ABASTECIMENTOS"
- extendedWaitUntil:
    visible: "HISTORICO DE ABASTECIMENTOS"
    timeout: 30000
- scrollUntilVisible:
    element: "NOVO ABASTECIMENTO"
    direction: DOWN
    visibilityPercentage: 30
- tapOn: "NOVO ABASTECIMENTO"
- extendedWaitUntil:
    visible: "Ex: 6.39"
    timeout: 30000
- tapOn: "Diesel S10"
- tapOn: "Ex: 6.39"
- inputText: "6.39"
- hideKeyboard
- tapOn: "Ex: 320"
- inputText: "100"
- hideKeyboard
- tapOn: "Ex: 182350"
- inputText: "180000"
- hideKeyboard
- scrollUntilVisible:
    element: "CADASTRAR ABASTECIMENTO"
    direction: DOWN
    visibilityPercentage: 30
- tapOn: "CADASTRAR ABASTECIMENTO"
- extendedWaitUntil:
    visible: "HISTORICO DE ABASTECIMENTOS"
    timeout: 30000
- scrollUntilVisible:
    element: "NOVO ABASTECIMENTO"
    direction: DOWN
    visibilityPercentage: 30
- tapOn: "NOVO ABASTECIMENTO"
- extendedWaitUntil:
    visible: "Ex: 6.39"
    timeout: 30000
- tapOn: "Diesel S10"
- tapOn: "Ex: 6.39"
- inputText: "6.39"
- hideKeyboard
- tapOn: "Ex: 320"
- inputText: "80"
- hideKeyboard
- tapOn: "Ex: 182350"
- inputText: "170000"
- hideKeyboard
- scrollUntilVisible:
    element: "CADASTRAR ABASTECIMENTO"
    direction: DOWN
    visibilityPercentage: 30
- tapOn: "CADASTRAR ABASTECIMENTO"
- extendedWaitUntil:
    visible: ".*uilometragem.*|Falha.*|Erro.*"
    timeout: 70000
