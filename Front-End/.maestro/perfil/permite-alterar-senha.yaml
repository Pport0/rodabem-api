# RNE-01: "Edicao: o usuario pode atualizar seus dados". A troca de senha existe no back (PATCH /users/me/senha) e o botao esta na tela.
appId: com.anonymous.rodabem
name: perfil - permite alterar a senha
---
- runScript: ../_comum/identidade.js
- runFlow: ../_comum/abrir.yaml
- tapOn: "CRIAR CONTA"
- runFlow:
    file: ../_comum/preencher-cadastro.yaml
    env:
      NOME: ${output.nome}
      CPF: ${output.cpf}
      TELEFONE: ${output.telefone}
      EMAIL: ${output.email}
      SENHA: ${output.senha}
- scrollUntilVisible:
    element: "CONTINUAR"
    direction: DOWN
- tapOn: "CONTINUAR"
- extendedWaitUntil:
    visible: "Insira suas credenciais para acessar"
    timeout: 30000
- runFlow:
    file: ../_comum/entrar.yaml
    env:
      CREDENCIAL: ${output.telefone}
      SENHA: ${output.senha}
- extendedWaitUntil:
    visible: "O que você precisa hoje?"
    timeout: 30000
- runFlow: ../_comum/abrir-menu.yaml
- tapOn: "Meu Perfil"
- scrollUntilVisible:
    element: "ALTERAR SENHA"
    direction: DOWN
    visibilityPercentage: 30
- tapOn: "ALTERAR SENHA"
# Tocar precisa levar a algum lugar onde a senha possa ser trocada.
- extendedWaitUntil:
    visible: "[Ss]enha atual|NOVA SENHA|Nova senha|Digite a nova senha"
    timeout: 20000
