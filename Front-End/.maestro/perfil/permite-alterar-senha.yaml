appId: com.anonymous.rodabem
name: perfil - alterar a senha encerra a sessao e leva ao login
---
- runScript: ../_comum/identidade.js
- runFlow: ../_comum/abrir.yaml
- tapOn: "CRIAR CONTA"
- runFlow:
    file: ../_comum/preencher-cadastro.yaml
    env:
      NOME: ${output.nome}
      CPF: ${output.cpf}
      TELEFONE: ${output.telefone}
      EMAIL: ${output.email}
      SENHA: ${output.senha}
- scrollUntilVisible:
    element: "CONTINUAR"
    direction: DOWN
- tapOn: "CONTINUAR"
- extendedWaitUntil:
    visible: "Insira suas credenciais para acessar"
    timeout: 30000
- runFlow:
    file: ../_comum/entrar.yaml
    env:
      CREDENCIAL: ${output.telefone}
      SENHA: ${output.senha}
- extendedWaitUntil:
    visible: "O que você precisa hoje?"
    timeout: 30000
- runFlow: ../_comum/abrir-menu.yaml
- tapOn: "Meu Perfil"
- scrollUntilVisible:
    element: "ALTERAR SENHA"
    direction: DOWN
    visibilityPercentage: 30
- tapOn: "ALTERAR SENHA"
- extendedWaitUntil:
    visible: "Digite sua senha atual"
    timeout: 20000
- tapOn: "Digite sua senha atual"
- inputText: ${output.senha}
- runFlow: ../_comum/fechar-teclado.yaml
- tapOn: "Digite a nova senha"
- inputText: "novaSenha456"
- runFlow: ../_comum/fechar-teclado.yaml
- tapOn: "Confirme a nova senha"
- inputText: "novaSenha456"
- runFlow: ../_comum/fechar-teclado.yaml
- tapOn: "SALVAR NOVA SENHA"
- extendedWaitUntil:
    visible: "Senha alterada com sucesso. Entre novamente com a nova senha."
    timeout: 30000
- assertVisible: "Insira suas credenciais para acessar"
- runFlow:
    file: ../_comum/entrar.yaml
    env:
      CREDENCIAL: ${output.telefone}
      SENHA: "novaSenha456"
- extendedWaitUntil:
    visible: "O que você precisa hoje?"
    timeout: 30000
