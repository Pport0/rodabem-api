appId: com.anonymous.rodabem
name: frete - recusa simulacao sem os campos obrigatorios
---
- runScript: ../_comum/identidade.js
- runFlow: ../_comum/abrir.yaml
- tapOn: "CRIAR CONTA"
- runFlow:
    file: ../_comum/preencher-cadastro.yaml
    env:
      NOME: ${output.nome}
      CPF: ${output.cpf}
      TELEFONE: ${output.telefone}
      EMAIL: ${output.email}
      SENHA: ${output.senha}
- scrollUntilVisible:
    element: "CONTINUAR"
    direction: DOWN
- tapOn: "CONTINUAR"
- extendedWaitUntil:
    visible: "Insira suas credenciais para acessar"
    timeout: 30000
- runFlow:
    file: ../_comum/entrar.yaml
    env:
      CREDENCIAL: ${output.telefone}
      SENHA: ${output.senha}
- extendedWaitUntil:
    visible: "O que você precisa hoje?"
    timeout: 30000
- tapOn: "CALCULADORA DE FRETE"
- extendedWaitUntil:
    visible: "DADOS DA VIAGEM"
    timeout: 30000
- scrollUntilVisible:
    element: "SIMULAR FRETE"
    direction: DOWN
    visibilityPercentage: 30
- tapOn: "SIMULAR FRETE"
- extendedWaitUntil:
    visible: ".*Preencha.*|.*obrigat.ri.*"
    timeout: 30000
